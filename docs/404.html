<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MyLifeDock — Redirecting...</title>
  <meta http-equiv="refresh" content="0; url=/mylifedock/">
  <script>
    // GitHub Pages SPA / Subpath 404 handler
    const path = window.location.pathname;
    if (path.includes('/app')) {
      window.location.replace('/mylifedock/app/');
    } else {
      window.location.replace('/mylifedock/');
    }
  </script>
</head>
<body style="background:#07090e; color:#fff; font-family:sans-serif; text-align:center; padding:50px;">
  <h2>Redirecting to MyLifeDock...</h2>
  <p><a href="/mylifedock/" style="color:#38bdf8;">Click here if you are not redirected automatically</a></p>
</body>
</html>
