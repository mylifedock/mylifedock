name: MyLifeDock CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to full commit SHAs (tags can be moved).
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # setup-node v4.4.0. No dependency cache (v4 caches only when `cache:` is
      # set), which avoids cache poisoning between workflow runs.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test
